<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rootcheck — Trace the evidence</title><style>
:root{--bg:#090a0c;--panel:#111317;--line:#292d34;--text:#f4f5f0;--muted:#9298a2;--lime:#d8ff3e;--red:#ff6b6b;--amber:#ffc95c;--green:#8ee38b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{border-right:1px solid var(--line);padding:24px 16px;background:#0c0d10;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;margin:0 8px 35px}.logo{width:32px;height:32px;background:var(--lime);color:#08090a;border-radius:9px;display:grid;place-items:center;font-size:21px;font-weight:900}.brand b{font-size:18px;letter-spacing:-.05em}.brand small{display:block;color:#777d86;font-size:8px;letter-spacing:.14em;text-transform:uppercase}nav{display:grid;gap:5px}nav button{border:0;background:none;color:#858a93;text-align:left;padding:11px;border-radius:8px}nav button:hover,nav button.active{background:#181a1f;color:#fff}.sidebox{margin:32px 8px 0;padding:14px;border:1px solid var(--line);border-radius:9px}.sidebox small{color:var(--lime);font-size:8px;letter-spacing:.16em}.sidebox p{font-size:10px;line-height:1.6;color:#8d929b}.foot{margin-top:auto;color:#5f646d;font-size:8px;line-height:1.7}.top{height:56px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 30px;color:#737982;font-size:9px;letter-spacing:.14em}.live{color:var(--lime)}main{min-width:0}.page{max-width:1100px;margin:auto;padding:80px 35px}.kicker{color:var(--lime);font-weight:800;font-size:9px;letter-spacing:.2em}.hero h1{font-size:68px;line-height:.92;letter-spacing:-.065em;margin:15px 0 20px}.hero h1 em{font-style:normal;color:var(--lime)}.hero p{max-width:650px;color:#999ea7;line-height:1.65;font-size:15px}.box{margin-top:34px;background:#101216;border:1px solid #343840;border-radius:12px;overflow:hidden;box-shadow:0 25px 80px #0008}.box textarea{width:100%;height:125px;padding:20px;background:none;color:#fff;border:0;outline:0;resize:vertical;font-size:16px}.actions{border-top:1px solid var(--line);padding:11px;display:flex;justify-content:flex-end}.primary{border:0;background:var(--lime);color:#08090a;font-weight:800;border-radius:7px;padding:12px 17px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.chip{border:1px solid var(--line);background:#14161a;color:#8e939c;border-radius:99px;padding:7px 9px;font-size:9px}.trust{display:flex;gap:20px;flex-wrap:wrap;color:#676c75;font-size:9px;margin-top:16px}.report{padding:35px;max-width:1300px;margin:auto}.reporthead{display:flex;justify-content:space-between;gap:20px}.report h2{font-size:32px;letter-spacing:-.04em;margin:10px 0}.sub{color:#707680;font-size:9px}.grid{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:9px;margin-top:20px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}.score{padding:17px;display:flex;gap:18px;align-items:center}.ring{width:82px;height:82px;border:5px solid var(--green);border-radius:50%;display:grid;place-items:center;font-size:25px;font-weight:900}.score h3{font-size:14px;margin:4px 0}.score p{font-size:9px;color:#858b94;line-height:1.5;margin:0}.metric{padding:17px}.metric span{display:block;color:#858b94;font-size:9px}.metric strong{display:block;font-size:22px;margin:10px 0}.metric i{font-size:8px;color:#666b73;font-style:normal}.bar{height:3px;background:#292c31}.bar b{display:block;height:100%;background:var(--lime)}.panel{margin-top:9px;padding:20px}.title{margin-bottom:18px}.title small{color:#858a93;font-size:8px;letter-spacing:.16em}.title h3{margin:6px 0 0;font-size:16px}.claim{max-width:650px;margin:auto;text-align:center;padding:16px;border:1px solid var(--line);border-radius:8px}.claim small,.source small{display:block;color:#70757e;font-size:8px;letter-spacing:.12em}.claim b{display:block;margin-top:7px}.line{height:25px;width:1px;background:#3b3e45;margin:auto}.sources{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.source{padding:14px;background:#15171b;border:1px solid var(--line);border-radius:8px}.source b{display:block;font-size:11px;margin:8px 0}.source p{font-size:9px;line-height:1.55;color:#8c9199;margin:0}.meta{display:flex;gap:7px;flex-wrap:wrap;color:#626770;font-size:8px;margin-top:12px}.flag{margin-top:10px;background:#1d1f24;padding:7px;border-radius:5px;color:#a7abb2;font-size:8px}.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:9px}.signal{display:grid;grid-template-columns:1fr 2fr 35px;gap:10px;padding:10px;border-bottom:1px solid var(--line);font-size:9px}.signal span{color:#858a93;line-height:1.4}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.recommend{padding:18px;border:1px solid #4b3030;border-radius:8px;background:#171416}.recommend h3{margin:0 0 7px}.recommend p{color:#8d929a;font-size:9px;line-height:1.55}.copy{width:100%;border:1px solid var(--line);background:#15171b;color:#aaaeb5;padding:10px;border-radius:7px;font-size:9px}.simple h1{font-size:50px;letter-spacing:-.05em}.history{max-width:850px;border-top:1px solid var(--line)}.hist{width:100%;padding:15px 4px;background:none;border:0;border-bottom:1px solid var(--line);color:#ddd;text-align:left;display:flex;justify-content:space-between}.method{display:grid;grid-template-columns:1fr 1fr;gap:9px}.method article{padding:18px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.method b{color:var(--lime);font-size:10px}.method p{color:#898e97;font-size:10px;line-height:1.6}@media(max-width:800px){.app{display:block}.side{display:none}.page,.report{padding:50px 16px}.hero h1{font-size:50px}.grid{grid-template-columns:1fr}.score{grid-column:auto}.sources,.cols,.method{grid-template-columns:1fr}.reporthead{display:block}.reporthead button{margin-top:15px}.top{padding:0 15px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">⌁</div><div><b>rootcheck</b><small>evidence intelligence</small></div></div><nav><button class="active" onclick="home()">◉ &nbsp;Check a claim</button><button onclick="historyPage()">↺ &nbsp;History</button><button onclick="methodPage()">◇ &nbsp;How it works</button></nav><div class="sidebox"><small>TRUST LENS</small><p>Trace claims to their roots. Spot weak studies, citation loops and stale evidence.</p></div><div class="foot">ROOTCHECK v1.0<br>Built for skeptical humans.</div></aside><main><div class="top"><span><i class="live">●</i> LIVE EVIDENCE WORKSPACE</span><button class="chip" onclick="home()">Clear</button></div><div id="view"></div></main></div><script>
const examples=['Cold showers boost testosterone by 50%.','Chocolate improves memory in older adults.','Remote workers are 13% more productive.'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function home(){view.innerHTML=`<section class="page hero"><div class="kicker">SOURCE DECAY TRACKER</div><h1>Don't just cite it.<br><em>Trace it.</em></h1><p>Paste a claim. Rootcheck maps the evidence chain, spots weak links and gives you a transparent trust score.</p><div class="box"><textarea id="claim">Cold showers boost testosterone by 50%.</textarea><div class="actions"><button class="primary" onclick="analyze()">Analyze evidence →</button></div></div><div class="chips">${examples.map((x,i)=>`<button class="chip" onclick="document.getElementById('claim').value=examples[${i}]">${esc(x)}</button>`).join('')}</div><div class="trust">✓ Citation lineage &nbsp; ✓ Source freshness &nbsp; ✓ Study quality &nbsp; ✓ Contradiction scan</div></section>`}
function analyze(){let c=document.getElementById('claim').value.trim();if(!c)return;view.innerHTML=`<section class="page"><div class="kicker">TRACING EVIDENCE</div><h1 class="simple h1">Following the claim to its roots…</h1><div class="panel" style="max-width:650px"><div class="signal"><b>01</b><span>Normalize claim</span><b class="good">✓</b></div><div class="signal"><b>02</b><span>Find supporting sources</span><b class="good">✓</b></div><div class="signal"><b>03</b><span>Trace citation lineage</span><b>…</b></div><div class="signal"><b>04</b><span>Score evidence quality</span><b>—</b></div></div></section>`;setTimeout(()=>report(c),900)}
function report(c){let health=/testosterone|cancer|vitamin|supplement|memory|weight|blood|disease|health|cold shower/i.test(c), viral=/50%|90%|10x|always|never|guarantee|proven/i.test(c);let score=Math.max(39,Math.min(91,82-(health?10:0)-(viral?17:0)));let sources=[['SECONDARY','Claim reproduced across multiple web sources','Repetition is not independent confirmation. Trace every citation to its underlying document.',score-12,'citation loop possible'],['PRIMARY',health?'Underlying study / research record':'Original research or dataset','Inspect the actual study or dataset rather than relying on summaries or press releases.',score-4,'needs verification'],['CONTEXT','Independent corroboration','Check replication, reviews, contradictory findings and whether the result generalizes.',score-18,'context check']];let r={claim:c,score,at:Date.now()};let h=JSON.parse(localStorage.rootcheckHistory||'[]');h.unshift(r);localStorage.rootcheckHistory=JSON.stringify(h.slice(0,20));view.innerHTML=`<section class="report"><div class="reporthead"><div><div class="kicker">EVIDENCE REPORT</div><h2>${esc(c)}</h2><div class="sub">Analyzed just now · ${sources.length} evidence nodes · 86% model confidence</div></div><button class="primary" onclick="home()">+ New check</button></div><div class="grid"><div class="card score"><div class="ring">${score}</div><div><div class="kicker">ROOTCHECK SCORE</div><h3>${score>=75?'Mostly supported':'Needs caution'}</h3><p>${score>=75?'A plausible evidence path exists, but context and the original source still matter.':'The claim shows signs of evidence compression or unusually strong wording.'}</p></div></div>${[['Freshness',score-2],['Primary-source strength',Math.max(35,score-7)],['Citation independence',Math.max(32,score-14)]].map(x=>`<div class="card metric"><span>${x[0]}</span><strong>${x[1]}<i>/100</i></strong><div class="bar"><b style="width:${x[1]}%"></b></div></div>`).join('')}</div><div class="panel"><div class="title"><small>EVIDENCE TREE</small><h3>Where this claim actually comes from</h3></div><div class="claim"><small>CLAIM</small><b>${esc(c)}</b></div><div class="line"></div><div class="sources">${sources.map(s=>`<article class="source"><small>${s[0]}</small><b>${s[1]}</b><p>${s[2]}</p><div class="meta"><span>${s[3]}/100</span><span>${s[4]}</span></div><div class="flag">⚠ Verify before treating this as definitive.</div></article>`).join('')}</div></div><div class="cols"><div class="panel"><div class="title"><small>DECAY SIGNALS</small><h3>Why the score moved</h3></div><div class="signal"><b class="warn">Evidence compression</b><span>The claim may be stronger than the evidence trail.</span><b class="bad">−12</b></div><div class="signal"><b class="warn">Independence</b><span>Repeated citations may not be independent.</span><b class="bad">−8</b></div><div class="signal"><b class="good">Traceability</b><span>A primary-source path can be investigated.</span><b class="good">+9</b></div></div><div class="panel"><div class="title"><small>RECOMMENDATION</small><h3>Safe to repeat?</h3></div><div class="recommend"><h3>${score>=75?'✓ Repeat with context':'! Do not repeat as fact'}</h3><p>${score>=75?'Use the underlying source and avoid upgrading correlation into causation.':'Find and inspect primary evidence before publishing or citing this strongly.'}</p></div><button class="copy" onclick="navigator.clipboard.writeText(${JSON.stringify(c+'\nRootcheck score: '+score+'/100')}).then(()=>this.textContent='Copied ✓')">Copy evidence summary</button></div></div></section>`}
function historyPage(){let h=JSON.parse(localStorage.rootcheckHistory||'[]');view.innerHTML=`<section class="page simple"><div class="kicker">HISTORY</div><h1>Previous checks.</h1><p>Saved locally in this browser.</p><div class="history">${h.length?h.map(x=>`<button class="hist" onclick="report(${JSON.stringify(x.claim)})"><span>${esc(x.claim)}</span><b>${x.score}</b></button>`).join(''):'<div class="sub" style="padding:20px 4px">No checks yet.</div>'}</div></section>`}
function methodPage(){view.innerHTML=`<section class="page simple"><div class="kicker">METHODOLOGY</div><h1>Evidence, not vibes.</h1><div class="method"><article><b>01 · Normalize</b><p>Turn a statement into a testable proposition with its population, quantity and timeframe.</p></article><article><b>02 · Trace</b><p>Walk backward through references to locate the earliest useful evidence.</p></article><article><b>03 · Inspect</b><p>Assess freshness, design, sample size, replication, conflicts and representation.</p></article><article><b>04 · Explain</b><p>Show the reasoning behind the score instead of hiding everything behind one number.</p></article></div></section>`}
home();
</script></body></html>
